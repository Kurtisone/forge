<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge</title>
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --accent:   #58a6ff;
      --green:    #3fb950;
      --red:      #f85149;
      --muted:    #8b949e;
      --text:     #e6edf3;
      --user-bg:  #1f6feb;
      --bot-bg:   #21262d;
      --radius:   10px;
      --font:     'Segoe UI', system-ui, sans-serif;
      --mono:     'Cascadia Code', 'Fira Code', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: .5px; }
    .logo span { color: var(--accent); }
    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: .8rem; color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      transition: background .3s;
    }
    .dot.ok  { background: var(--green); }
    .dot.err { background: var(--red); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab {
      padding: 10px 20px;
      font-size: .9rem;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
      user-select: none;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── Panels ── */
    .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .panel.active { display: flex; }

    /* ── Chat ── */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: .92rem;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      background: var(--user-bg);
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }
    .msg.bot {
      background: var(--bot-bg);
      align-self: flex-start;
      border-bottom-left-radius: 3px;
      border: 1px solid var(--border);
    }
    .msg.bot.error { border-color: var(--red); }
    .msg-meta {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .msg.bot pre, .msg.bot code {
      font-family: var(--mono);
      font-size: .85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      margin-top: 6px;
      display: block;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: .8rem;
      font-style: italic;
      max-width: 90%;
    }
    .msg-actions {
      display: flex; gap: 6px; align-items: center;
      margin-top: 4px;
    }
    .pin-btn {
      background: none; border: none; padding: 0;
      font-size: .8rem; color: var(--muted);
      cursor: pointer; align-self: auto;
    }
    .pin-btn:hover { color: var(--accent); opacity: 1; }
    .pin-btn.pinned { color: #d29922; }
    #compact-btn { align-self: center; margin: 0 0 8px; }

    /* ── Drawer panel ── */
    #drawer-panel { padding: 20px; overflow-y: auto; gap: 10px; }
    .drawer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: .88rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .drawer-card .role { color: var(--accent); font-size: .72rem; text-transform: uppercase; margin-bottom: 4px; }
    .drawer-empty { color: var(--muted); font-size: .85rem; }
    .thinking {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: .85rem;
    }
    .dots span {
      animation: blink 1.2s infinite;
      font-size: 1.4rem; line-height: 0;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0 } 40% { opacity: 1 } }

    #chat-input-row {
      display: flex; gap: 8px;
      padding: 14px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: .92rem;
      padding: 10px 14px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 160px;
      transition: border-color .2s;
      overflow-y: auto;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      white-space: nowrap;
      align-self: flex-end;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

    /* ── Traces panel ── */
    #traces-panel {
      padding: 20px;
      overflow-y: auto;
      gap: 10px;
    }
    .trace-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: .85rem;
    }
    .trace-card:hover { border-color: var(--accent); }
    .trace-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 6px;
    }
    .trace-id { font-family: var(--mono); color: var(--accent); font-size: .78rem; }
    .trace-ok  { color: var(--green); }
    .trace-err { color: var(--red); }
    .trace-time { color: var(--muted); font-size: .75rem; }
    .trace-input { color: var(--muted); font-style: italic; margin-bottom: 6px; }
    .trace-steps { display: flex; gap: 6px; flex-wrap: wrap; }
    .step-pill {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 2px 10px;
      font-size: .75rem; color: var(--muted);
    }
    .step-pill.ok  { border-color: var(--green); color: var(--green); }
    .step-pill.err { border-color: var(--red);   color: var(--red); }
    #traces-refresh {
      align-self: flex-start; margin-bottom: 4px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">⚙ <span>Forge</span></div>
  <div style="display:flex;align-items:center;gap:14px;">
    <button class="btn-outline" id="token-btn" onclick="promptForToken()" title="Définir le token API (si API_TOKEN est configuré côté serveur)">🔑 Token</button>
    <div class="status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">connecting…</span>
    </div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="chat">Chat</div>
  <div class="tab" data-tab="drawer">Tiroir</div>
  <div class="tab" data-tab="traces">Traces</div>
</div>

<!-- Chat -->
<div class="panel active" id="chat-panel">
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <textarea id="chat-input" placeholder="Posez votre question…" rows="1"></textarea>
    <button id="send-btn" onclick="sendChat()">Envoyer</button>
  </div>
</div>

<!-- Drawer -->
<div class="panel" id="drawer-panel">
  <button class="btn-outline" id="compact-btn" onclick="compactNow()">🗜 Compacter maintenant</button>
  <div id="drawer-list"></div>
</div>

<!-- Traces -->
<div class="panel" id="traces-panel">
  <button class="btn-outline" id="traces-refresh" onclick="loadTraces()">↺ Rafraîchir</button>
  <div id="traces-list"></div>
</div>

<script>
// ── API token (only needed if the server sets API_TOKEN) ───────────
// Stored in localStorage purely for convenience across reloads; the
// server treats it as a bearer secret over the Authorization header.
function getToken() { return localStorage.getItem('forge_api_token') || '' }
function promptForToken() {
  const current = getToken()
  const next = prompt('Token API Forge (laisser vide si le serveur n\'en exige pas) :', current)
  if (next === null) return
  if (next.trim()) localStorage.setItem('forge_api_token', next.trim())
  else localStorage.removeItem('forge_api_token')
}
async function apiFetch(url, opts = {}) {
  const token = getToken()
  const headers = Object.assign({}, opts.headers || {})
  if (token) headers['Authorization'] = `Bearer ${token}`
  const r = await fetch(url, Object.assign({}, opts, { headers }))
  if (r.status === 401) promptForToken()
  return r
}

// ── Tab switching ─────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'))
    tab.classList.add('active')
    document.getElementById(tab.dataset.tab + '-panel').classList.add('active')
    if (tab.dataset.tab === 'traces') loadTraces()
    if (tab.dataset.tab === 'drawer') loadDrawer()
  })
})

// Load on startup
checkHealth()
loadHistory()

// ── Health check ──────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch('/health')
    const data = await r.json()
    document.getElementById('status-dot').className = 'dot ok'
    document.getElementById('status-text').textContent =
      `${data.provider} · ${data.model.slice(0, 30)}`
  } catch {
    document.getElementById('status-dot').className = 'dot err'
    document.getElementById('status-text').textContent = 'offline'
  }
}

// ── Chat ──────────────────────────────────────────────────────────
const messages = document.getElementById('chat-messages')
let _busy = false

function appendMsg(id, text, role, meta, pinned) {
  const div = document.createElement('div')
  div.className = `msg ${role}`
  div.innerHTML = formatContent(text)

  const actions = document.createElement('div')
  actions.className = 'msg-actions'
  if (meta) {
    const m = document.createElement('span')
    m.className = 'msg-meta'
    m.textContent = meta
    actions.appendChild(m)
  }
  if (id != null && role !== 'system') {
    const pinBtn = document.createElement('button')
    pinBtn.className = 'pin-btn' + (pinned ? ' pinned' : '')
    pinBtn.textContent = pinned ? '📌 Épinglé' : '📌 Épingler'
    pinBtn.onclick = () => togglePin(id, !pinned)
    actions.appendChild(pinBtn)
  }
  if (actions.children.length) div.appendChild(actions)

  messages.appendChild(div)
  messages.scrollTop = messages.scrollHeight
  return div
}

function formatContent(text) {
  // Wrap code blocks in <pre>
  return text.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
    `<pre>${escapeHtml(code.trim())}</pre>`
  ).replace(/`([^`]+)`/g, (_, c) => `<code>${escapeHtml(c)}</code>`)
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

function showThinking() {
  const div = document.createElement('div')
  div.className = 'msg bot thinking'
  div.id = 'thinking-indicator'
  div.innerHTML = '<div class="dots"><span>·</span><span>·</span><span>·</span></div>'
  messages.appendChild(div)
  messages.scrollTop = messages.scrollHeight
}

function removeThinking() {
  document.getElementById('thinking-indicator')?.remove()
}

// Fil unique: le fil est reconstruit depuis /history à chaque
// chargement de page et après chaque tour, au lieu d'être un état
// purement côté client -- c'est ce qui permet de survivre à un
// rechargement et donne à chaque bulle un id réel pour le tiroir.
async function loadHistory() {
  try {
    const r = await apiFetch('/history')
    const history = await r.json()
    messages.innerHTML = ''
    history.forEach(m => {
      const role = m.role === 'user' ? 'user' : (m.role === 'system' ? 'system' : 'bot')
      appendMsg(m.id, m.content, role, null, m.pinned)
    })
  } catch (e) {
    // History is a convenience layer -- a failed load shouldn't block chat.
  }
}

async function togglePin(messageId, pin) {
  try {
    await apiFetch(`/drawer/${pin ? 'pin' : 'unpin'}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message_id: messageId})
    })
    loadHistory()
  } catch (e) { /* best-effort */ }
}

async function sendChat() {
  if (_busy) return
  const input = document.getElementById('chat-input')
  const text = input.value.trim()
  if (!text) return

  _busy = true
  document.getElementById('send-btn').disabled = true
  input.value = ''
  input.style.height = 'auto'

  appendMsg(null, text, 'user')
  showThinking()

  try {
    const r = await apiFetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    })
    const data = await r.json()
    removeThinking()
    if (!data.ok) {
      appendMsg(null, data.output || '[empty response]', 'bot error', data.error || '')
    }
  } catch (e) {
    removeThinking()
    appendMsg(null, `Erreur réseau : ${e.message}`, 'bot error')
  }

  // Reload from the server so the just-sent exchange gets its real
  // ids (needed for pin buttons) and any compaction that ran on this
  // turn is reflected immediately.
  await loadHistory()

  _busy = false
  document.getElementById('send-btn').disabled = false
  input.focus()
}

// Auto-resize textarea
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto'
  this.style.height = Math.min(this.scrollHeight, 160) + 'px'
})

// Send on Enter (Shift+Enter = newline)
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat() }
})

// ── Drawer (v3.9) ────────────────────────────────────────────────
async function loadDrawer() {
  const list = document.getElementById('drawer-list')
  list.innerHTML = '<div class="drawer-empty">Chargement…</div>'
  try {
    const r = await apiFetch('/drawer')
    const pinned = await r.json()
    if (!pinned.length) {
      list.innerHTML = '<div class="drawer-empty">Aucun message épinglé pour l\'instant. Épinglez un message depuis l\'onglet Chat pour le garder au-delà de la compaction.</div>'
      return
    }
    list.innerHTML = ''
    pinned.forEach(m => {
      const card = document.createElement('div')
      card.className = 'drawer-card'
      card.innerHTML = `
        <div>
          <div class="role">${m.role}</div>
          <div>${escapeHtml(m.content)}</div>
        </div>
      `
      const unpinBtn = document.createElement('button')
      unpinBtn.className = 'btn-outline'
      unpinBtn.textContent = 'Retirer'
      unpinBtn.onclick = async () => { await togglePin(m.id, false); loadDrawer() }
      card.appendChild(unpinBtn)
      list.appendChild(card)
    })
  } catch (e) {
    list.innerHTML = `<div style="color:var(--red);font-size:.85rem">Erreur : ${e.message}</div>`
  }
}

async function compactNow() {
  const btn = document.getElementById('compact-btn')
  btn.disabled = true
  const original = btn.textContent
  btn.textContent = '…'
  try {
    const r = await apiFetch('/compact', { method: 'POST' })
    const data = await r.json()
    btn.textContent = data.removed > 0 ? `✓ ${data.removed} messages compactés` : '✓ rien à compacter'
    await loadHistory()
  } catch (e) {
    btn.textContent = '✗ échec'
  }
  setTimeout(() => { btn.textContent = original; btn.disabled = false }, 2000)
}

// ── Traces ────────────────────────────────────────────────────────
async function loadTraces() {
  const list = document.getElementById('traces-list')
  list.innerHTML = '<div style="color:var(--muted);font-size:.85rem">Chargement…</div>'
  try {
    const r = await apiFetch('/traces?n=15')
    const data = await r.json()
    const traces = data.traces || []
    if (!traces.length) {
      list.innerHTML = '<div style="color:var(--muted);font-size:.85rem">Aucune trace pour l\'instant.</div>'
      return
    }
    list.innerHTML = ''
    ;[...traces].reverse().forEach(t => {
      const ok = t.ok
      const card = document.createElement('div')
      card.className = 'trace-card'
      const steps = (t.steps || []).map(s =>
        `<span class="step-pill ${s.tool_ok ? 'ok' : 'err'}">${s.router_tool || '?'} ${s.duration_ms}ms</span>`
      ).join('')
      card.innerHTML = `
        <div class="trace-header">
          <span class="trace-id">#${t.run_id}</span>
          <span class="${ok ? 'trace-ok' : 'trace-err'}">${ok ? '✓' : '✗'}</span>
          <span class="trace-time">${t.timestamp} · ${t.total_ms}ms</span>
        </div>
        <div class="trace-input">${escapeHtml(t.user_input_preview || '')}</div>
        <div class="trace-steps">${steps}</div>
        ${t.error ? `<div style="color:var(--red);font-size:.78rem;margin-top:6px">⚠ ${escapeHtml(t.error)}</div>` : ''}
      `
      list.appendChild(card)
    })
  } catch (e) {
    list.innerHTML = `<div style="color:var(--red);font-size:.85rem">Erreur : ${e.message}</div>`
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge</title>
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --accent:   #58a6ff;
      --green:    #3fb950;
      --red:      #f85149;
      --muted:    #8b949e;
      --text:     #e6edf3;
      --user-bg:  #1f6feb;
      --bot-bg:   #21262d;
      --radius:   10px;
      --font:     'Segoe UI', system-ui, sans-serif;
      --mono:     'Cascadia Code', 'Fira Code', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: .5px; }
    .logo span { color: var(--accent); }
    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: .8rem; color: var(--muted);
      min-width: 0;
    }
    #status-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      transition: background .3s;
    }
    .dot.ok  { background: var(--green); }
    .dot.err { background: var(--red); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab {
      padding: 10px 20px;
      font-size: .9rem;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
      user-select: none;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── Panels ── */
    .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .panel.active { display: flex; }

    /* ── Chat ── */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .msg {
      position: relative;
      max-width: 78%;
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: .92rem;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      background: var(--user-bg);
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }
    .msg.bot {
      background: var(--bot-bg);
      align-self: flex-start;
      border-bottom-left-radius: 3px;
      border: 1px solid var(--border);
    }
    .msg.bot.error { border-color: var(--red); }
    .msg-meta {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .msg.bot pre {
      font-family: var(--mono);
      font-size: .85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: 6px 0;
    }
    .msg code {
      font-family: var(--mono);
      font-size: .85em;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }
    .msg pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 1em;
    }
    .msg h3, .msg h4, .msg h5 {
      margin: 10px 0 4px;
      line-height: 1.3;
    }
    .msg h3 { font-size: 1.05rem; }
    .msg h4 { font-size: .98rem; }
    .msg h5 { font-size: .92rem; }
    .msg ul, .msg ol {
      margin: 6px 0;
      padding-left: 22px;
    }
    .msg li { margin: 2px 0; }
    .msg a { color: var(--accent); }
    /* ```diff blocks -- colored like `git diff` output */
    .msg pre.diff span { display: block; }
    .msg pre.diff .diff-add { color: var(--green); }
    .msg pre.diff .diff-del { color: var(--red); }
    .msg pre.diff .diff-hunk { color: var(--accent); }
    .msg pre.diff .diff-ctx { color: var(--muted); }
    .msg.system {
      align-self: center;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: .8rem;
      font-style: italic;
      max-width: 90%;
    }
    /* Pin: a small floating badge sitting on the bubble's outer
       corner (opposite the tail, so it never sits over the text),
       hidden until the bubble is hovered so it doesn't clutter the
       thread. Pinned messages keep a soft permanent glow instead of a
       label -- state is legible at a glance without extra text. */
    .pin-icon {
      position: absolute;
      top: -7px;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      padding: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.35);
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transform: scale(.8);
      transform-origin: center;
      transition: opacity .15s ease, transform .15s ease, color .15s, border-color .15s;
    }
    .msg.bot .pin-icon { right: -9px; }
    .msg.user .pin-icon { left: -9px; }
    .msg:hover .pin-icon { opacity: .75; transform: scale(1); }
    .pin-icon:hover { opacity: 1 !important; color: var(--accent); border-color: var(--accent); }
    .pin-icon.pinned {
      opacity: 1; transform: scale(1);
      color: #d29922; border-color: #d29922;
      box-shadow: 0 0 0 3px rgba(210,153,34,.15), 0 2px 6px rgba(0,0,0,.35);
    }
    .pin-icon.pinned:hover { color: #e3a83a; border-color: #e3a83a; }
    #compact-btn { align-self: center; margin: 0 0 8px; }

    /* ── Drawer panel ── */
    #drawer-panel { padding: 20px; overflow-y: auto; gap: 10px; }
    .drawer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: .88rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .drawer-card .role { color: var(--accent); font-size: .72rem; text-transform: uppercase; margin-bottom: 4px; }
    .drawer-empty { color: var(--muted); font-size: .85rem; }
    .thinking {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: .85rem;
    }
    .dots span {
      animation: blink 1.2s infinite;
      font-size: 1.4rem; line-height: 0;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0 } 40% { opacity: 1 } }

    #chat-input-row {
      display: flex; gap: 8px;
      padding: 14px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: .92rem;
      padding: 10px 14px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 160px;
      transition: border-color .2s;
      overflow-y: auto;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      white-space: nowrap;
      align-self: flex-end;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

    /* ── Traces panel ── */
    #traces-panel {
      padding: 20px;
      overflow-y: auto;
      gap: 10px;
    }
    .trace-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: .85rem;
    }
    .trace-card:hover { border-color: var(--accent); }
    .trace-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 6px;
    }
    .trace-id { font-family: var(--mono); color: var(--accent); font-size: .78rem; }
    .trace-ok  { color: var(--green); }
    .trace-err { color: var(--red); }
    .trace-time { color: var(--muted); font-size: .75rem; }
    .trace-input { color: var(--muted); font-style: italic; margin-bottom: 6px; }
    .trace-steps { display: flex; gap: 6px; flex-wrap: wrap; }
    .step-pill {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 2px 10px;
      font-size: .75rem; color: var(--muted);
    }
    .step-pill.ok  { border-color: var(--green); color: var(--green); }
    .step-pill.err { border-color: var(--red);   color: var(--red); }
    .step-pill.expandable { cursor: pointer; user-select: none; }
    .step-pill.expandable:hover { background: var(--surface); }
    .step-pill .caret { display: inline-block; margin-left: 4px; transition: transform .15s; }
    .step-pill.open .caret { transform: rotate(90deg); }
    .sub-steps {
      display: none; flex-direction: column; gap: 4px;
      margin: 8px 0 2px 4px; padding-left: 10px;
      border-left: 2px solid var(--border);
    }
    .sub-steps.open { display: flex; }
    .sub-step-row {
      display: flex; align-items: baseline; gap: 8px;
      font-size: .78rem;
    }
    .sub-step-label { color: var(--accent); font-family: var(--mono); min-width: 80px; }
    .sub-step-detail { color: var(--muted); }
    .sub-step-ms { color: var(--muted); font-size: .72rem; margin-left: auto; }
    #traces-refresh {
      align-self: flex-start; margin-bottom: 4px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span>Forge</span></div>
  <div style="display:flex;align-items:center;gap:14px;">
    <button class="btn-outline" id="token-btn" onclick="promptForToken()" title="Définir le token API (si API_TOKEN est configuré côté serveur)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>Token</button>
    <div class="status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">connecting…</span>
    </div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="chat">Chat</div>
  <div class="tab" data-tab="drawer">Tiroir</div>
  <div class="tab" data-tab="traces">Traces</div>
</div>

<!-- Chat -->
<div class="panel active" id="chat-panel">
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <textarea id="chat-input" placeholder="Posez votre question…" rows="1"></textarea>
    <button id="send-btn" onclick="sendChat()">Envoyer</button>
  </div>
</div>

<!-- Drawer -->
<div class="panel" id="drawer-panel">
  <button class="btn-outline" id="compact-btn" onclick="compactNow()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><polyline points="7 13 12 18 17 13"></polyline><polyline points="7 6 12 11 17 6"></polyline></svg>Compacter maintenant</button>
  <div id="drawer-list"></div>
</div>

<!-- Traces -->
<div class="panel" id="traces-panel">
  <button class="btn-outline" id="traces-refresh" onclick="loadTraces()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>Rafraîchir</button>
  <div id="traces-list"></div>
</div>

<script>
// ── API token (only needed if the server sets API_TOKEN) ───────────
// Stored in localStorage purely for convenience across reloads; the
// server treats it as a bearer secret over the Authorization header.
function getToken() { return localStorage.getItem('forge_api_token') || '' }
function promptForToken() {
  const current = getToken()
  const next = prompt('Token API Forge (laisser vide si le serveur n\'en exige pas) :', current)
  if (next === null) return
  if (next.trim()) localStorage.setItem('forge_api_token', next.trim())
  else localStorage.removeItem('forge_api_token')
}
async function apiFetch(url, opts = {}) {
  const token = getToken()
  const headers = Object.assign({}, opts.headers || {})
  if (token) headers['Authorization'] = `Bearer ${token}`
  const r = await fetch(url, Object.assign({}, opts, { headers }))
  if (r.status === 401) promptForToken()
  return r
}

// ── Tab switching ─────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'))
    tab.classList.add('active')
    document.getElementById(tab.dataset.tab + '-panel').classList.add('active')
    if (tab.dataset.tab === 'traces') loadTraces()
    if (tab.dataset.tab === 'drawer') loadDrawer()
  })
})

// Load on startup
checkHealth()
loadHistory()

// ── Health check ──────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch('/health')
    const data = await r.json()
    document.getElementById('status-dot').className = 'dot ok'
    const text = `${data.provider} · ${data.model}`
    const el = document.getElementById('status-text')
    el.textContent = text
    el.title = text
  } catch {
    document.getElementById('status-dot').className = 'dot err'
    document.getElementById('status-text').textContent = 'offline'
  }
}

// ── Chat ──────────────────────────────────────────────────────────
const messages = document.getElementById('chat-messages')
let _busy = false

// Minimal thumbtack outline, sized to sit quietly next to a bubble --
// deliberately monochrome (currentColor) so .pin-icon's color rules
// (muted/hover/pinned) apply without touching this markup.
const PIN_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>'

function appendMsg(id, text, role, meta, pinned, pairRole, scroll = true) {
  const bubble = document.createElement('div')
  bubble.className = `msg ${role}`
  bubble.innerHTML = formatContent(text)
  if (meta) {
    const m = document.createElement('div')
    m.className = 'msg-meta'
    m.textContent = meta
    bubble.appendChild(m)
  }

  const bubbleRole = role.split(' ')[0]  // strip ' error' suffix
  if (id != null && bubbleRole !== 'system') {
    const pinBtn = document.createElement('button')
    pinBtn.className = 'pin-icon' + (pinned ? ' pinned' : '')
    pinBtn.innerHTML = PIN_SVG
    pinBtn.title = pinned ? 'Retirer du tiroir' : 'Épingler dans le tiroir'
    pinBtn.onclick = () => togglePin(id, pairRole, !pinned)
    bubble.appendChild(pinBtn)
  }

  messages.appendChild(bubble)
  if (scroll) messages.scrollTop = messages.scrollHeight
  return bubble
}

// Lightweight markdown renderer -- deliberately not a CDN library
// (marked.js, etc.): Forge is meant to run fully local/offline, and
// pulling a script from a CDN on every page load would quietly break
// that the day the NiPoGi has no internet. Covers the common subset
// LLM answers actually use: code fences (with special handling for
// ```diff), inline code, bold/italic, links, headers, and lists.
// Not full CommonMark (no tables/blockquotes yet).
function formatContent(text) {
  // 1. Pull out fenced code blocks first so nothing inside them is
  //    touched by the rules below, then restore them at the end.
  const blocks = []
  let working = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const body = code.replace(/\n$/, '')
    const html = lang === 'diff' ? renderDiff(body) : `<pre><code>${escapeHtml(body)}</code></pre>`
    blocks.push(html)
    return `\x00BLOCK${blocks.length - 1}\x00`
  })

  // 2. Escape everything else BEFORE applying inline markdown, so any
  //    literal '<'/'&' in the model's own answer can't inject markup
  //    (the old version only escaped inside code fences).
  working = escapeHtml(working)
  working = working.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)

  // 3. Block-level: headers and lists, line by line.
  const lines = working.split('\n')
  const out = []
  let list = null  // { type: 'ul'|'ol', items: [] }
  const flushList = () => {
    if (list) {
      out.push(`<${list.type}>${list.items.map(i => `<li>${i}</li>`).join('')}</${list.type}>`)
      list = null
    }
  }
  for (const line of lines) {
    const h = line.match(/^(#{1,3})\s+(.*)/)
    if (h) {
      flushList()
      const level = h[1].length + 2  // h3..h5 -- h1/h2 read too large in a chat bubble
      out.push(`<h${level}>${inlineMarkdown(h[2])}</h${level}>`)
      continue
    }
    const ul = line.match(/^[-*]\s+(.*)/)
    if (ul) {
      if (!list || list.type !== 'ul') { flushList(); list = { type: 'ul', items: [] } }
      list.items.push(inlineMarkdown(ul[1]))
      continue
    }
    const ol = line.match(/^\d+\.\s+(.*)/)
    if (ol) {
      if (!list || list.type !== 'ol') { flushList(); list = { type: 'ol', items: [] } }
      list.items.push(inlineMarkdown(ol[1]))
      continue
    }
    flushList()
    out.push(inlineMarkdown(line))
  }
  flushList()
  working = out.join('\n')

  // 4. Restore code blocks.
  return working.replace(/\x00BLOCK(\d+)\x00/g, (_, i) => blocks[Number(i)])
}

// Only these schemes may ever become an href. escapeHtml() now closes
// the attribute-escape route, but a *syntactically valid* href is
// still dangerous on its own: `[clique ici](javascript:alert)` needs
// no quote at all, it just needs to be rendered as a link. Anything
// not matching is downgraded to plain text rather than dropped, so a
// legitimate-but-unusual URL is still readable instead of vanishing.
const _SAFE_LINK_SCHEME = /^(https?:\/\/|mailto:|\/|#)/i

function inlineMarkdown(s) {
  return s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
      const href = url.trim()
      if (!_SAFE_LINK_SCHEME.test(href)) return `${label} (${href})`
      return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`
    })
}

// ```diff blocks: colored like `git diff` instead of plain text, so a
// "here's what changed" answer doesn't read as a wall of code.
function renderDiff(code) {
  const lines = code.split('\n').map(l => {
    const esc = escapeHtml(l)
    if (l.startsWith('+')) return `<span class="diff-add">${esc}</span>`
    if (l.startsWith('-')) return `<span class="diff-del">${esc}</span>`
    if (l.startsWith('@@')) return `<span class="diff-hunk">${esc}</span>`
    return `<span class="diff-ctx">${esc}</span>`
  })
  return `<pre class="diff">${lines.join('\n')}</pre>`
}

// Quotes matter as much as angle brackets here: this output lands in
// ATTRIBUTE position in several places (inlineMarkdown's <a href="...">
// above, the trace/drawer template literals below), so escaping only
// &/</> leaves a straight attribute escape open. Concretely, before
// this: `[x](" autofocus onfocus="location=name)` rendered as
// <a href="" autofocus onfocus="location=name" ...> and executed with
// no interaction at all -- and the text reaching formatContent()
// includes tool output (web_fetch/research page content, files:read,
// sysadmin logs), so a hostile page was enough to reach it. The API
// token lives in localStorage, so that XSS was a token theft, not a
// cosmetic bug.
function escapeHtml(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
}

function showThinking() {
  const div = document.createElement('div')
  div.className = 'msg bot thinking'
  div.id = 'thinking-indicator'
  div.innerHTML = '<div class="dots"><span>·</span><span>·</span><span>·</span></div>'
  messages.appendChild(div)
  messages.scrollTop = messages.scrollHeight
}

function removeThinking() {
  document.getElementById('thinking-indicator')?.remove()
}

// Fil unique: le fil est reconstruit depuis /history à chaque
// chargement de page et après chaque tour, au lieu d'être un état
// purement côté client -- c'est ce qui permet de survivre à un
// rechargement et donne à chaque bulle un id réel pour le tiroir.
async function loadHistory() {
  try {
    const r = await apiFetch('/history')
    const history = await r.json()
    messages.innerHTML = ''
    history.forEach(m => {
      const role = m.role === 'user' ? 'user' : (m.role === 'system' ? 'system' : 'bot')
      appendMsg(m.id, m.content, role, null, m.pinned, m.role, false)
    })
    messages.scrollTop = messages.scrollHeight
  } catch (e) {
    // History is a convenience layer -- a failed load shouldn't block chat.
  }
}

// Épingler une bulle épingle par défaut l'échange entier (question +
// réponse) -- une réponse relue hors contexte perd tout son sens, et
// vice versa. add_exchange() côté serveur assigne toujours l'id de
// l'assistant juste après celui de l'utilisateur, donc le partenaire
// se déduit sans info supplémentaire. Désépingler reste individuel :
// on peut retirer l'un des deux après coup sans toucher à l'autre.
async function togglePin(messageId, role, pin) {
  const ids = [messageId]
  if (pin) {
    const partnerId = role === 'user' ? messageId + 1 : messageId - 1
    if (partnerId > 0) ids.push(partnerId)
  }
  try {
    await Promise.allSettled(ids.map(id => apiFetch(`/drawer/${pin ? 'pin' : 'unpin'}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message_id: id})
    })))
    loadHistory()
  } catch (e) { /* best-effort */ }
}

async function sendChat() {
  if (_busy) return
  const input = document.getElementById('chat-input')
  const text = input.value.trim()
  if (!text) return

  _busy = true
  document.getElementById('send-btn').disabled = true
  input.value = ''
  input.style.height = 'auto'

  appendMsg(null, text, 'user')
  showThinking()

  try {
    const r = await apiFetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    })
    const data = await r.json()
    removeThinking()
    if (!data.ok) {
      appendMsg(null, data.output || '[empty response]', 'bot error', data.error || '')
    }
  } catch (e) {
    removeThinking()
    appendMsg(null, `Erreur réseau : ${e.message}`, 'bot error')
  }

  // Reload from the server so the just-sent exchange gets its real
  // ids (needed for pin buttons) and any compaction that ran on this
  // turn is reflected immediately.
  await loadHistory()

  _busy = false
  document.getElementById('send-btn').disabled = false
  input.focus()
}

// Auto-resize textarea
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto'
  this.style.height = Math.min(this.scrollHeight, 160) + 'px'
})

// Send on Enter (Shift+Enter = newline)
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat() }
})

// ── Drawer (v3.9) ────────────────────────────────────────────────
async function loadDrawer() {
  const list = document.getElementById('drawer-list')
  list.innerHTML = '<div class="drawer-empty">Chargement…</div>'
  try {
    const r = await apiFetch('/drawer')
    const pinned = await r.json()
    if (!pinned.length) {
      list.innerHTML = '<div class="drawer-empty">Aucun message épinglé pour l\'instant. Épinglez un message depuis l\'onglet Chat pour le garder au-delà de la compaction.</div>'
      return
    }
    list.innerHTML = ''
    pinned.forEach(m => {
      const card = document.createElement('div')
      card.className = 'drawer-card'
      card.innerHTML = `
        <div>
          <div class="role">${m.role}</div>
          <div>${escapeHtml(m.content)}</div>
        </div>
      `
      const unpinBtn = document.createElement('button')
      unpinBtn.className = 'btn-outline'
      unpinBtn.textContent = 'Retirer'
      unpinBtn.onclick = async () => { await togglePin(m.id, false); loadDrawer() }
      card.appendChild(unpinBtn)
      list.appendChild(card)
    })
  } catch (e) {
    list.innerHTML = `<div style="color:var(--red);font-size:.85rem">Erreur : ${e.message}</div>`
  }
}

async function compactNow() {
  const btn = document.getElementById('compact-btn')
  btn.disabled = true
  const original = btn.textContent
  btn.textContent = '…'
  try {
    const r = await apiFetch('/compact', { method: 'POST' })
    const data = await r.json()
    btn.textContent = data.removed > 0 ? `✓ ${data.removed} messages compactés` : '✓ rien à compacter'
    await loadHistory()
  } catch (e) {
    btn.textContent = '✗ échec'
  }
  setTimeout(() => { btn.textContent = original; btn.disabled = false }, 2000)
}

// Toggles one step's sub-steps panel (discover/collect/synthesize
// detail for graph-based tools). `pillEl` gets the 'open' class too,
// purely for the caret rotation -- see the .step-pill.open CSS rule.
function toggleSubSteps(subId, pillEl) {
  const panel = document.getElementById(subId)
  if (!panel) return
  const opening = !panel.classList.contains('open')
  panel.classList.toggle('open', opening)
  pillEl.classList.toggle('open', opening)
}

// ── Traces ────────────────────────────────────────────────────────
async function loadTraces() {
  const list = document.getElementById('traces-list')
  list.innerHTML = '<div style="color:var(--muted);font-size:.85rem">Chargement…</div>'
  try {
    const r = await apiFetch('/traces?n=15')
    const data = await r.json()
    const traces = data.traces || []
    if (!traces.length) {
      list.innerHTML = '<div style="color:var(--muted);font-size:.85rem">Aucune trace pour l\'instant.</div>'
      return
    }
    list.innerHTML = ''
    ;[...traces].reverse().forEach(t => {
      const ok = t.ok
      const card = document.createElement('div')
      card.className = 'trace-card'

      // Each step becomes a pill; steps that carry sub_steps (graph-based
      // tools like sysadmin/review/research publish these -- see
      // forge/subtrace.py) get a caret and are clickable to reveal the
      // internal discover/collect/synthesize breakdown right underneath.
      let stepsHtml = ''
      let subStepsHtml = ''
      ;(t.steps || []).forEach((s, i) => {
        const subId = `sub-${t.run_id}-${i}`
        const hasSub = Array.isArray(s.sub_steps) && s.sub_steps.length > 0
        stepsHtml += `<span class="step-pill ${s.tool_ok ? 'ok' : 'err'} ${hasSub ? 'expandable' : ''}"` +
          (hasSub ? ` onclick="toggleSubSteps('${subId}', this)"` : '') + `>` +
          `${s.router_tool || '?'} ${s.duration_ms != null ? s.duration_ms + 'ms' : '—'}` +
          (hasSub ? '<span class="caret">▸</span>' : '') +
          `</span>`
        if (hasSub) {
          const rows = s.sub_steps.map(sub => `
            <div class="sub-step-row">
              <span class="sub-step-label">${escapeHtml(sub.label || '?')}</span>
              <span class="sub-step-detail">${escapeHtml(sub.detail || '')}</span>
              <span class="sub-step-ms">${sub.duration_ms != null ? sub.duration_ms + 'ms' : ''}</span>
            </div>`).join('')
          subStepsHtml += `<div class="sub-steps" id="${subId}">${rows}</div>`
        }
      })

      card.innerHTML = `
        <div class="trace-header">
          <span class="trace-id">#${t.run_id}</span>
          <span class="${ok ? 'trace-ok' : 'trace-err'}">${ok ? '✓' : '✗'}</span>
          <span class="trace-time">${t.timestamp} · ${t.total_ms}ms</span>
        </div>
        <div class="trace-input">${escapeHtml(t.user_input_preview || '')}</div>
        <div class="trace-steps">${stepsHtml}</div>
        ${subStepsHtml}
        ${t.error ? `<div style="color:var(--red);font-size:.78rem;margin-top:6px">⚠ ${escapeHtml(t.error)}</div>` : ''}
      `
      list.appendChild(card)
    })
  } catch (e) {
    list.innerHTML = `<div style="color:var(--red);font-size:.85rem">Erreur : ${e.message}</div>`
  }
}
</script>
